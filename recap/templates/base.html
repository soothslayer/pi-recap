<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}pi-recap{% endblock %}</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989f; --accent:#0a84ff; --danger:#ff453a; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; margin:0; padding:0 16px 48px; max-width:820px; margin-inline:auto; }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid #333; position:sticky; top:0; background:var(--bg); }
  header h1 { font-size:1.2rem; margin:0; }
  header h1 a { color:var(--text); text-decoration:none; }
  nav a { color:var(--accent); text-decoration:none; margin-left:14px; font-size:.95rem; }
  .card { background:var(--card); border-radius:12px; padding:14px 16px; margin:12px 0; }
  .card h3 { margin:0 0 6px; font-size:1.05rem; }
  .card h3 a { color:var(--text); text-decoration:none; }
  .meta { color:var(--muted); font-size:.82rem; }
  .summary { margin:8px 0 0; line-height:1.45; }
  ul.points { margin:8px 0 0; padding-left:20px; }
  ul.points li { margin:4px 0; }
  .tag { display:inline-block; background:#2c2c2e; border-radius:6px; padding:2px 8px; font-size:.75rem; color:var(--muted); margin-right:6px; }
  form.search { margin:16px 0; display:flex; gap:8px; }
  form.search input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid #333; background:#1c1c1e; color:var(--text); font-size:1rem; }
  form.search button, .btn { padding:10px 16px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  .btn.danger { background:var(--danger); }
  .btn.ghost { background:#2c2c2e; color:var(--text); }
  pre.transcript { white-space:pre-wrap; background:#000; border-radius:10px; padding:12px; font-size:.9rem; line-height:1.5; max-height:420px; overflow:auto; }
  .rewind-box { font-size:1.25rem; line-height:1.6; background:#000; border-radius:12px; padding:20px; margin:16px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #status { font-size:.85rem; color:var(--muted); }
  .private-banner { display:none; margin-top:12px; padding:10px 14px; border-radius:10px; font-size:.9rem; font-weight:600;
    background:#3a2b00; border:1px solid #b8860b; color:#ffd60a; }
  .private-banner.on { display:block; }
  .btn.private-on { background:#b8860b; }
</style>
</head>
<body>
<header>
  <h1><a href="/">🎙️ pi-recap</a></h1>
  <nav>
    <a href="/">Episodes</a>
    <a href="/daily">Daily</a>
    <a href="/rewind">Rewind</a>
  </nav>
</header>
<div class="private-banner {% if private %}on{% endif %}" id="privateBanner">🔒 PRIVATE MODE — nothing leaves your LAN. Cloud LLM backends are blocked.</div>
<div class="row" style="margin-top:12px">
  <span id="status">…</span>
  <button class="btn ghost" id="pauseBtn" onclick="togglePause()">Pause</button>
  <button class="btn ghost" id="privateBtn" onclick="togglePrivate()">Private: off</button>
</div>
{% block content %}{% endblock %}
<script>
async function refreshStatus(){
  try {
    const r = await fetch('/api/status'); const s = await r.json();
    document.getElementById('status').textContent =
      (s.paused ? '⏸ paused' : '● listening') + ' · ' + s.episodes + ' episodes';
    document.getElementById('pauseBtn').textContent = s.paused ? 'Resume' : 'Pause';
    setPrivateUI(s.private);
  } catch(e){ document.getElementById('status').textContent = 'status unavailable'; }
}
function setPrivateUI(on){
  const btn = document.getElementById('privateBtn');
  const banner = document.getElementById('privateBanner');
  btn.textContent = on ? 'Private: ON' : 'Private: off';
  btn.classList.toggle('private-on', !!on);
  banner.classList.toggle('on', !!on);
}
async function togglePause(){
  const r = await fetch('/api/status'); const s = await r.json();
  await fetch(s.paused ? '/api/resume' : '/api/pause', {method:'POST'});
  refreshStatus(); setTimeout(()=>location.reload(), 400);
}
async function togglePrivate(){
  const r = await fetch('/api/status'); const s = await r.json();
  await fetch(s.private ? '/api/private/off' : '/api/private/on', {method:'POST'});
  refreshStatus();
}
refreshStatus(); setInterval(refreshStatus, 10000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
